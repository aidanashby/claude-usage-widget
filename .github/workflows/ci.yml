name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The suite is pure functions only, so it needs no display and no
      # credentials. A failure prints to stdout and exits non-zero.
      - name: Self-test
        run: python widget.pyw --selftest
